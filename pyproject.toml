[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvlite"
version = "1.0.0"
description = "Crash-safe key-value database with a write-ahead log and asyncio TCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vinodhini" }]
dependencies = []

[project.scripts]
kvlite = "kvlite.__main__:main"

[tool.setuptools]
packages = ["kvlite"]
